server {
    listen 80;
    listen [::]:80;
    server_name junleyuan.eissys.top;

    return 301 https://junleyuan.eissys.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name junleyuan.eissys.top;

    root /var/www/eiscore;
    index index.html;
    client_max_body_size 100m;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    ssl_certificate /etc/ssl/junleyuan.eissys.top/fullchain.cer;
    ssl_certificate_key /etc/ssl/junleyuan.eissys.top/junleyuan.eissys.top.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /asset-manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /company {
        return 301 /company/;
    }

    location = /login {
        root /var/www;
        try_files /company/index.html =404;
    }

    location /company/ {
        root /var/www;
        try_files $uri $uri/ /company/index.html;
    }

    location /api/ {
        default_type application/json;
        rewrite ^/api/workflow\.definitions(.*)$ /definitions$1 break;
        rewrite ^/api/workflow\.instances(.*)$ /instances$1 break;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /doc/ {
        proxy_pass http://127.0.0.1:8079;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ide/ {
        proxy_pass http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
