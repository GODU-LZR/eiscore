server {
    listen       80;
    server_name  localhost;
    absolute_redirect off;

    # 子应用路由 - 生产模式（使用已构建的静态文件）
    # 注意：这些子应用在当前配置中未独立构建，全部功能已集成在主应用 /assets/ 中
    # 如果需要开发模式，请在宿主机启动对应端口的 Vite 服务器
    location = /materials/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /materials/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /hr/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /hr/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /apps/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    # Standalone Flash preview belongs to the apps micro-frontend. Without
    # this boundary it falls through to the host index and may redirect a
    # narrow iframe to the mobile application.
    location /apps/preview/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /apps/index.html;
    }
    # /apps/ is the authenticated host deep link; keep the exact micro-app
    # entry above for qiankun while routing the directory URL through the shell.
    location = /apps/ { root /usr/share/nginx/html; rewrite ^ /index.html break; }
    location /apps/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /company-site/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /company-site/admin/ {
        proxy_pass http://agent-runtime:8078/company-site/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /company-site/public/ {
        proxy_pass http://agent-runtime:8078/company-site/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /company-site/auth/ {
        proxy_pass http://agent-runtime:8078/company-site/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /company-site/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /sales/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /sales/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /purchase/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /purchase/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /production/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /production/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /quality/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /quality/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /equipment/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /equipment/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /decision/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /decision/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    # These directory URLs collide with real micro-app folders. Keep them as
    # authenticated host deep links; the explicit index.html remains the
    # qiankun entry used by the host.
    location = /decision { root /usr/share/nginx/html; rewrite ^ /index.html break; }
    location = /decision/ { root /usr/share/nginx/html; rewrite ^ /index.html break; }

    # 1. 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Host-owned AI alias must reach Vue Router instead of the runtime API
    # regex location below.
    location = /ai/enterprise { root /usr/share/nginx/html; rewrite ^ /index.html break; }

    # Realtime channel used by Flash and dashboard sub-apps.
    location = /ws {
        proxy_pass http://agent-runtime:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. PostgREST API 转发
    location /api/ {
        default_type  application/json;
        rewrite ^/api/workflow\.definitions(.*)$ /definitions$1 break;
        rewrite ^/api/workflow\.instances(.*)$ /instances$1 break;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
    }

    # 3. Harness Web embed. The Web profile owns auth, assets, plugins and
    # websocket/API protocol; agent-runtime is only the EISCore tool gateway.
    location /harness-embed/ {
        proxy_pass http://deepseek-web:3081/;
        proxy_redirect / /harness-embed/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the port for local origins such as 127.0.0.1:18080. The
        # Harness auth plugin uses this header to build its same-origin return.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
         sub_filter '<base href="/">' '<base href="/harness-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const dismiss=()=>{const dialog=document.querySelector("[role=dialog][aria-label=内测声明]");const button=dialog?.querySelector("button");if(button){observer.disconnect();button.click()}};const observer=new MutationObserver(dismiss);observer.observe(document,{childList:true,subtree:true});dismiss();const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
        sub_filter '"/plugins/' '"/harness-embed-plugins/';
        sub_filter '"/assets/' '"/harness-embed-assets/';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Flash Builder uses an isolated coding-only DSH profile. Keep the
    # business feature plugins on the main Harness profile above.
    location /harness-flash-embed/ {
        proxy_pass http://deepseek-flash-web:3081/;
        proxy_redirect / /harness-flash-embed/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter '<base href="/">' '<base href="/harness-flash-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const dismiss=()=>{const dialog=document.querySelector("[role=dialog][aria-label=内测声明]");const button=dialog?.querySelector("button");if(button){observer.disconnect();button.click()}};const observer=new MutationObserver(dismiss);observer.observe(document,{childList:true,subtree:true});dismiss();const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-flash-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-flash-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EisWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-flash-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EisWebSocket,k,{value:W[k],enumerable:true});EisWebSocket.prototype=W.prototype;window.WebSocket=EisWebSocket})()</script>';
        sub_filter '"/plugins/' '"/harness-flash-embed-plugins/';
        sub_filter '"/assets/' '"/harness-flash-embed-assets/';
        sub_filter '"/plugins/events' '"/harness-flash-embed-plugins-events';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /harness-embed-plugins/ {
        proxy_pass http://deepseek-web:3081/plugins/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /harness-flash-embed-plugins/ {
        proxy_pass http://deepseek-flash-web:3081/plugins/;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /harness-embed-assets/ {
        proxy_pass http://deepseek-web:3081/assets/;
        proxy_set_header Host $http_host;
    }

    location /harness-flash-embed-assets/ {
        proxy_pass http://deepseek-flash-web:3081/assets/;
        proxy_set_header Host $http_host;
    }

    location /harness-flash-embed-plugins-events {
        proxy_pass http://deepseek-flash-web:3081/plugins/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # DSH client plugin hot/event stream is requested from the native /plugins
    # path after the embedded bundle boots.
    location = /plugins/events {
        proxy_pass http://deepseek-web:3081/plugins/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /harness-embed-api/ {
        proxy_pass http://deepseek-web:3081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /harness-flash-embed-api/ {
        proxy_pass http://deepseek-flash-web:3081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Flash has its own runtime and internal network. Never send these calls
    # through the business Agent Runtime.
    location /flash-agent/ {
        proxy_pass http://flash-agent-runtime:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # 3.3 Harness canonical HTTP routes
    location ~ ^/flash/ {
        proxy_pass http://flash-agent-runtime:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/(ai|twin|document-intake)/ {
        proxy_pass http://agent-runtime:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # This bundled public image is also listed in the client cache manifest.
    # Serve its exact static path before the general Agent API proxy.
    location = /agent/company-site/public/assets/site/factory-overview.jpg {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # 4. AI Runtime HTTP 接口转发
    location /agent/ {
        proxy_pass http://agent-runtime:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. 移动端子应用
    location = /mobile/index.html { root /usr/share/nginx/html; try_files $uri =404; }
    location /mobile/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
