<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" />
    <title>企业信息化系统 - 移动端</title>
    <style>
      #eiscore-bootstrap-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        gap: 14px;
        align-content: center;
        color: #1557a6;
        background: #f8fafc;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #eiscore-bootstrap-loading.is-dismissing {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .eiscore-bootstrap-loading__ring {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(21, 87, 166, 0.18);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: eiscore-bootstrap-loading-spin 800ms linear infinite;
      }

      .eiscore-bootstrap-loading__label {
        margin: 0;
        color: #475569;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }

      @keyframes eiscore-bootstrap-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #eiscore-bootstrap-loading { transition-duration: 0ms; }
        .eiscore-bootstrap-loading__ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="eiscore-bootstrap-loading" role="status" aria-live="polite" aria-label="正在加载">
      <span class="eiscore-bootstrap-loading__ring" aria-hidden="true"></span>
      <p class="eiscore-bootstrap-loading__label">正在加载</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
