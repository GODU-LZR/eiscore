name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            eiscore-*/package-lock.json
            realtime/package-lock.json

      - name: Verify pinned toolchain
        run: npm run toolchain:check -- --strict

      - name: Install dependencies
        run: npm run ci:install

      - name: Run quality gates
        env:
          EISCORE_QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:quality

      - name: Run isolated database integration gates
        run: npm run test:database:docker

      - name: Run database release/recovery concurrency gate
        run: node scripts/test-database-operation-lock.mjs

      - name: Run offline regression tests
        run: npm run test:unit

      - name: Build frontends
        run: npm run build:frontends
