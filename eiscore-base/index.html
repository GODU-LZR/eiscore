<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      #eiscore-bootstrap-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        gap: 14px;
        align-content: center;
        color: #1557a6;
        background: #f8fafc;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #eiscore-bootstrap-loading.is-dismissing {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .eiscore-bootstrap-loading__ring {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(21, 87, 166, 0.18);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: eiscore-bootstrap-loading-spin 800ms linear infinite;
      }

      .eiscore-bootstrap-loading__label {
        margin: 0;
        color: #475569;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }

      @keyframes eiscore-bootstrap-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #eiscore-bootstrap-loading { transition-duration: 0ms; }
        .eiscore-bootstrap-loading__ring { animation: none; }
      }
    </style>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') return

        // Vite serves source modules directly. A previously installed production
        // worker would otherwise return stale /src/*.js and CSS from cache.
        var isViteDevelopment = Boolean(document.querySelector('script[src="/@vite/client"]'))
        if (isViteDevelopment) {
          var DEV_CLEANUP_KEY = 'eiscore-vite-dev-cache-cleanup-v1'
          Promise.all([
            navigator.serviceWorker.getRegistrations()
              .then(function (registrations) {
                return Promise.all(registrations.map(function (registration) {
                  return registration.unregister()
                }))
              })
              .catch(function () { return [] }),
            ('caches' in window ? caches.keys() : Promise.resolve([]))
              .then(function (keys) {
                return Promise.all(keys
                  .filter(function (key) { return key.indexOf('eiscore-client-assets-') === 0 })
                  .map(function (key) { return caches.delete(key) }))
              })
              .catch(function () { return [] })
          ]).then(function () {
            if (!navigator.serviceWorker.controller) return
            try {
              if (sessionStorage.getItem(DEV_CLEANUP_KEY) === 'done') return
              sessionStorage.setItem(DEV_CLEANUP_KEY, 'done')
            } catch (e) {}
            var next = new URL(location.href)
            next.searchParams.set('__vite_fresh', Date.now().toString())
            location.replace(next.toString())
          })
          return
        }

        var RELEASE_VERSION = '20260930051151'
        var CACHE_PREFIX = 'eiscore-client-assets-v' + RELEASE_VERSION + '-'
        var VERSION_KEY = 'eiscore-client-version'
        var RELOAD_KEY = 'eiscore-client-reloaded-version'

        var schedule = window.requestIdleCallback || function (callback, options) {
          return window.setTimeout(callback, (options && options.timeout) || 12000)
        }

        function readManifest() {
          return fetch('/asset-manifest.json?v=' + encodeURIComponent(RELEASE_VERSION) + '&t=' + Date.now(), { cache: 'no-store' })
            .then(function (response) {
              if (!response.ok) throw new Error('manifest ' + response.status)
              return response.json()
            })
            .catch(function () { return null })
        }

        function cleanupOldCaches(version) {
          if (!version || !('caches' in window)) return Promise.resolve(false)
          var current = CACHE_PREFIX + version
          return caches.keys()
            .then(function (keys) {
              var oldKeys = keys.filter(function (key) {
                return key.indexOf(CACHE_PREFIX) === 0 && key !== current
              })
              if (!oldKeys.length) return false
              return Promise.all(oldKeys.map(function (key) { return caches.delete(key) }))
                .then(function (results) { return results.some(Boolean) })
            })
            .catch(function () { return false })
        }

        function reloadOnce(version) {
          try {
            if (sessionStorage.getItem(RELOAD_KEY) === version) return
            sessionStorage.setItem(RELOAD_KEY, version)
          } catch (e) {}
          location.reload()
        }

        function checkClientVersion() {
          readManifest().then(function (manifest) {
            var version = manifest && manifest.version
            if (!version) return

            var previous = ''
            try { previous = localStorage.getItem(VERSION_KEY) || '' } catch (e) {}

            cleanupOldCaches(version).then(function (deletedOldCaches) {
              try { localStorage.setItem(VERSION_KEY, version) } catch (e) {}
              if ((previous && previous !== version) || deletedOldCaches) {
                reloadOnce(version)
              }
            })
          })
        }

        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'EIS_CLIENT_CACHE_READY' && event.data.version) {
            checkClientVersion()
          }
        })

        checkClientVersion()

        window.addEventListener('load', function () {
          schedule(function () {
            navigator.serviceWorker.register('/sw.js')
              .then(function () { return navigator.serviceWorker.ready })
              .then(function (registration) {
                if (registration && typeof registration.update === 'function') {
                  registration.update().catch(function () {})
                }
                window.setTimeout(function () {
                  var worker = registration.active || registration.waiting || registration.installing
                  if (worker) worker.postMessage({ type: 'PRECACHE_CLIENT_ASSETS', mode: 'background' })
                }, 18000)
              })
              .catch(function () {})
          }, { timeout: 12000 })
        })
      })()
    </script>
  </head>
  <body>
    <div id="eiscore-bootstrap-loading" role="status" aria-live="polite" aria-label="正在加载">
      <span class="eiscore-bootstrap-loading__ring" aria-hidden="true"></span>
      <p class="eiscore-bootstrap-loading__label">正在加载</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
