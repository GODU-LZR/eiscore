# Install as a new, separate server block on the host. This block owns only
# Jinwei's namespace. Keep vedio.eiscore.top in its existing short-video
# server block; never replace it with a parent *.eiscore.top catch-all.
server {
    listen 80;
    listen [::]:80;
    # The apex is required because a DNS wildcard does not match the apex.
    # The scoped wildcard is optional, but stays below jwwc.eiscore.top so it
    # cannot capture vedio.eiscore.top or another EISCore application.
    server_name jwwc.eiscore.top *.jwwc.eiscore.top;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:18192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }
}
