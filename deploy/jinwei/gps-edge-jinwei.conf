# Include this block in the existing gps-platform edge nginx http context.
# Runtime Docker DNS resolution lets the edge start before the trial web
# container; requests become healthy as soon as jinwei-trial-web is ready.
server {
    listen 80;
    listen [::]:80;
    server_name jwwc.eiscore.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jwwc.eiscore.top;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GPS_TLS:10m;

    client_max_body_size 128k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $jinwei_trial_upstream http://jinwei-trial-web:8080;

    location / {
        proxy_pass $jinwei_trial_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

