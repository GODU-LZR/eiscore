# Optional HTTPS server block for Jinwei's apex and scoped child subdomains.
# Obtain a certificate containing BOTH names before enabling this block:
#   jwwc.eiscore.top
#   *.jwwc.eiscore.top
# A *.eiscore.top certificate covers the apex jwwc.eiscore.top, but it does
# not cover foo.jwwc.eiscore.top. Wildcard certificates require DNS-01.
# Replace the certificate paths with the actual certbot certificate name.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jwwc.eiscore.top *.jwwc.eiscore.top;

    ssl_certificate /etc/letsencrypt/live/jwwc.eiscore.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jwwc.eiscore.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:18192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }
}

