map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Public manufacturer site. The public listener deliberately has its own
# server block so the admin portal can use a separate host and policy later.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"jinwei-eiscore-web","listener":"public"}';
    }

    location = / {
        return 302 /company-site/jinwei;
    }

    location = /company-site {
        return 302 /company-site/jinwei;
    }

    location /api/ {
        proxy_pass http://jinwei-eiscore-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        proxy_read_timeout 60s;
    }

    location /agent/ {
        proxy_pass http://jinwei-eiscore-agent:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /company-site/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /company-site/ {
        try_files $uri $uri/ /company-site/index.html;
    }

    location / {
        try_files $uri $uri/ /company-site/index.html;
    }
}

# Authenticated EISCore portal. It shares the release tree and internal
# services with the public listener but has no public-root redirect.
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"jinwei-eiscore-web","listener":"admin"}';
    }

    location = /asset-manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://jinwei-eiscore-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        rewrite ^/api/workflow\.definitions(.*)$ /definitions$1 break;
        rewrite ^/api/workflow\.instances(.*)$ /instances$1 break;
        proxy_read_timeout 60s;
    }

    location /agent/ {
        proxy_pass http://jinwei-eiscore-agent:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /doc/ {
        proxy_pass http://jinwei-eiscore-swagger:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ide/ {
        proxy_pass http://jinwei-eiscore-ide:8443/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /company-site/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /company-site {
        return 302 /company-site/jinwei;
    }

    location /company-site/ {
        try_files $uri $uri/ /company-site/index.html;
    }

    location /hr/ {
        try_files $uri $uri/ /hr/index.html;
    }
    location /materials/ {
        try_files $uri $uri/ /materials/index.html;
    }
    location /apps/ {
        try_files $uri $uri/ /apps/index.html;
    }
    location /sales/ {
        try_files $uri $uri/ /sales/index.html;
    }
    location /purchase/ {
        try_files $uri $uri/ /purchase/index.html;
    }
    location /production/ {
        try_files $uri $uri/ /production/index.html;
    }
    location /quality/ {
        try_files $uri $uri/ /quality/index.html;
    }
    location /equipment/ {
        try_files $uri $uri/ /equipment/index.html;
    }
    location /decision/ {
        try_files $uri $uri/ /decision/index.html;
    }
    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
