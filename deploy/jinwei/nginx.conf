server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 128k;
    # Keep the SPA redirect relative when this server is behind the host edge;
    # otherwise nginx would expose its internal :8080 port in Location.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true,"service":"jinwei-web","mode":"trial"}';
    }

    location = / {
        return 302 /company-site/jinwei;
    }

    location = /agent/company-site/public/leads {
        proxy_pass http://jinwei-leads:8093/company-site/public/leads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_read_timeout 15s;
    }

    location /company-site/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /company-site/ {
        try_files $uri $uri/ /company-site/index.html;
    }

    location / {
        try_files $uri $uri/ /company-site/index.html;
    }
}
