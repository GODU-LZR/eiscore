name: lundu-eiscore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: eiscore
      POSTGREST_DB_PASSWORD: "${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}"
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
    volumes:
      - lundu_eiscore_pgdata:/var/lib/postgresql/data
      - ./source/database/bootstrap/roles-v2.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./source/database/baselines/eiscore-db-v1/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./source/database/baselines/eiscore-db-v1/register.sql:/docker-entrypoint-initdb.d/02_register.sql:ro
      - ./source/database/migrations/sql/core-002-role-boundaries.sql:/docker-entrypoint-initdb.d/03_role_boundaries.sql:ro
      - ./source/scripts/configure-database-runtime-secrets-v2.sh:/docker-entrypoint-initdb.d/04_runtime_secrets.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d eiscore"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      PGRST_DB_URI: "postgres://eiscore_authenticator:${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}@db:5432/eiscore"
      PGRST_DB_SCHEMAS: "public,hr,scm,app_center,workflow,app_data,company_site"
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
    depends_on: {db: {condition: service_healthy}}

  agent:
    build: {context: ./source/realtime, dockerfile: Dockerfile.prod}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: development
      COMPANY_SITE_PREVIEW_ALLOW_DRAFT: "true"
      PORT: 8078
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_agent
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      AGENT_POSTGREST_URL: http://api:3000
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      FLASH_CLINE_ENABLED: "${FLASH_CLINE_ENABLED:-false}"
    depends_on: {db: {condition: service_healthy}, api: {condition: service_started}}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:18393:80"]
    volumes:
      - ./release:/usr/share/nginx/html:ro
      - ./nginx/lundu-eiscore.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, agent]

  deepseek-web:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m]
    command: ["/opt/bridge/node_modules/.bin/dsh", "--profile", "web", "--patch", "/opt/eiscore-harness/dsh-web.patch.yml", "--host", "0.0.0.0", "--port", "3080", "--no-open"]
    environment:
      DSH_HOME: /var/lib/dsh
      EISCORE_GATEWAY_URL: http://agent:8078
      EISCORE_AUTH_URL: https://lundu.eiscore.top
    volumes:
      - deepseek_web_dsh_home:/var/lib/dsh
      - /opt/codex-dev/eiscore-refactor/agent-harness:/opt/eiscore-harness:ro
    networks:
      - default
      - agent-internal
    depends_on: [agent]

volumes:
  lundu_eiscore_pgdata:
  deepseek_web_dsh_home:

networks:
  agent-internal:
    external: true
    name: eiscore-agent-internal
