services:
  deepseek-web:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    entrypoint: ["node"]
    command: ["--expose-internals", "/opt/eiscore-harness/dsh-web-runner.mjs"]
    environment:
      DSH_HOME: /var/lib/dsh
      EISCORE_GATEWAY_URL: http://agent:8078
      EISCORE_AUTH_URL: https://lundu.eiscore.top
    volumes:
      - deepseek_web_dsh_home:/var/lib/dsh
      - /opt/codex-dev/eiscore-refactor/agent-harness:/opt/eiscore-harness:ro
    networks:
      - lundu-net
      - agent-internal
    depends_on:
      agent:
        condition: service_started

volumes:
  deepseek_web_dsh_home:

networks:
  lundu-net:
    external: true
    name: lundu-eiscore_default
  agent-internal:
    external: true
    name: eiscore-agent-internal
