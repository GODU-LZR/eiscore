server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  # Signed permission claims can exceed 8 KiB; keep request headers bounded.
  large_client_header_buffers 4 16k;
  location = / { return 302 /login; }
  location = /mobile/login { return 302 /login$is_args$args; }
  location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
  # Standalone Flash preview belongs to the apps micro-frontend. Keep it
  # away from the host fallback, which can redirect a narrow iframe to /mobile/.
  location /apps/preview/ { try_files $uri $uri/ /apps/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/eiscore/ { return 403; }
  location /api/ { proxy_pass http://api:3000/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
  location ~ ^/flash/ { proxy_pass http://flash-agent-runtime:8078; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location ~ ^/(ai|twin|document-intake)/ { proxy_pass http://agent:8078; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /agent/ { proxy_pass http://agent:8078/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/admin/ { proxy_pass http://agent:8078/company-site/admin/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/public/ { proxy_pass http://agent:8078/company-site/public/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/auth/ { proxy_pass http://agent:8078/company-site/auth/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/ { try_files $uri $uri/ /company-site/index.html; }
  location /harness/ { try_files $uri $uri/ /index.html; }
  # Work-assistant and workbench are separate Harness Web profiles. Keep
  # their browser, API, plugin, and WebSocket paths disjoint; /harness-embed/
  # below remains the legacy workbench-compatible alias.
  location /harness-assistant-embed/ {
    set $harness_assistant_embed_allowed 0;
    if ($http_sec_fetch_dest = "iframe") { set $harness_assistant_embed_allowed 1; }
    if ($http_referer ~ "^https://lundu\.eiscore\.top/") { set $harness_assistant_embed_allowed 1; }
    if ($harness_assistant_embed_allowed = 0) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_pass http://deepseek-assistant-web:3081/;
    proxy_redirect / /harness-assistant-embed/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness-assistant-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-assistant-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-assistant-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-assistant-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
    sub_filter '"/plugins/events' '"/harness-assistant-embed-plugins-events';
    sub_filter '"/plugins/' '"/harness-assistant-embed-plugins/';
    sub_filter '"/assets/' '"/harness-assistant-embed-assets/';
  }
  location /harness-workbench-embed/ {
    set $harness_workbench_embed_allowed 0;
    if ($http_sec_fetch_dest = "iframe") { set $harness_workbench_embed_allowed 1; }
    if ($http_referer ~ "^https://lundu\.eiscore\.top/") { set $harness_workbench_embed_allowed 1; }
    if ($harness_workbench_embed_allowed = 0) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_pass http://deepseek-web:3081/;
    proxy_redirect / /harness-workbench-embed/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness-workbench-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-workbench-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-workbench-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-workbench-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
    sub_filter '"/plugins/events' '"/harness-workbench-embed-plugins-events';
    sub_filter '"/plugins/' '"/harness-workbench-embed-plugins/';
    sub_filter '"/assets/' '"/harness-workbench-embed-assets/';
  }
  location /harness-embed/ {
    set $harness_embed_allowed 0;
    if ($http_sec_fetch_dest = "iframe") { set $harness_embed_allowed 1; }
    if ($http_referer ~ "^https://lundu\.eiscore\.top/") { set $harness_embed_allowed 1; }
    if ($harness_embed_allowed = 0) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_pass http://deepseek-web:3081/;
    proxy_redirect / /harness-embed/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const dismiss=()=>{const dialog=document.querySelector("[role=dialog][aria-label=内测声明]");const button=dialog?.querySelector("button");if(button){observer.disconnect();button.click()}};const observer=new MutationObserver(dismiss);observer.observe(document,{childList:true,subtree:true});dismiss();const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
    sub_filter '"/plugins/' '"/harness-embed-plugins/';
    sub_filter '"/assets/' '"/harness-embed-assets/';
  }
  # Flash Builder uses a coding-only Harness profile. Business feature
  # plugins are available only through the main /harness-embed/ profile.
  location /harness-flash-embed/ {
    proxy_pass http://deepseek-flash-web:3081/;
    proxy_redirect / /harness-flash-embed/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 1h;
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness-flash-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-flash-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-flash-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;window.WebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-flash-embed-api/"):u,p)}})()</script>';
    sub_filter '"/plugins/' '"/harness-flash-embed-plugins/';
    sub_filter '"/assets/' '"/harness-flash-embed-assets/';
    sub_filter '"/plugins/events' '"/harness-flash-embed-plugins-events';
  }
  location /harness-embed/assets/ {
    proxy_pass http://deepseek-web:3081/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /harness-assistant-embed/assets/ {
    proxy_pass http://deepseek-assistant-web:3081/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /harness-workbench-embed/assets/ {
    proxy_pass http://deepseek-web:3081/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /harness-embed-plugins/ { proxy_pass http://deepseek-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-assistant-embed-plugins/ { proxy_pass http://deepseek-assistant-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-workbench-embed-plugins/ { proxy_pass http://deepseek-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-flash-embed-plugins/ { proxy_pass http://deepseek-flash-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-embed-assets/ { proxy_pass http://deepseek-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-assistant-embed-assets/ { proxy_pass http://deepseek-assistant-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-workbench-embed-assets/ { proxy_pass http://deepseek-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-assistant-embed-plugins-events { proxy_pass http://deepseek-assistant-web:3081/plugins/events; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Authorization $http_authorization; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
  location /harness-workbench-embed-plugins-events { proxy_pass http://deepseek-web:3081/plugins/events; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Authorization $http_authorization; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
  location /harness-flash-embed-assets/ { proxy_pass http://deepseek-flash-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-flash-embed-plugins-events { proxy_pass http://deepseek-flash-web:3081/plugins/events; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Authorization $http_authorization; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
  location /harness-embed-api/ { proxy_pass http://deepseek-web:3081/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /harness-assistant-embed-api/ { proxy_pass http://deepseek-assistant-web:3081/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-workbench-embed-api/ { proxy_pass http://deepseek-web:3081/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-flash-embed-api/ { proxy_pass http://deepseek-flash-web:3081/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-api/ { return 403; }
  location /harness-plugins/ { return 403; }
  location /harness-assets/ { return 403; }
}
