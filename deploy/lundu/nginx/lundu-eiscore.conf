server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  location = / { return 302 /login; }
  location = /mobile/login { return 302 /login$is_args$args; }
  location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/eiscore/ { proxy_pass http://deepseek-web:3081; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /api/ { proxy_pass http://api:3000/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
  location /agent/ { proxy_pass http://agent:8078/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /harness/ {
    proxy_pass http://deepseek-web:3081/;
    proxy_redirect / /harness/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness/"><script>window.__EIS_HARNESS__=1;(()=>{const dismiss=()=>{const dialog=document.querySelector("[role=dialog][aria-label=内测声明]");const button=dialog?.querySelector("button");if(button){observer.disconnect();button.click()}};const observer=new MutationObserver(dismiss);observer.observe(document,{childList:true,subtree:true});dismiss();const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
    sub_filter '"/plugins/' '"/harness-plugins/';
    sub_filter '"/assets/' '"/harness-assets/';
  }
  location /harness-plugins/ { proxy_pass http://deepseek-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /plugins/ { proxy_pass http://deepseek-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-assets/ { proxy_pass http://deepseek-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-api/ { proxy_pass http://deepseek-web:3081/api/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
