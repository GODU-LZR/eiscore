server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  location = / { return 302 /login; }
  location = /mobile/login { return 302 /login$is_args$args; }
  location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/eiscore/ { return 403; }
  location /api/ { proxy_pass http://api:3000/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
  location ~ ^/(ai|flash|twin|document-intake)/ { proxy_pass http://agent:8078; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /agent/ { proxy_pass http://agent:8078/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/admin/ { proxy_pass http://agent:8078/company-site/admin/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/public/ { proxy_pass http://agent:8078/company-site/public/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/auth/ { proxy_pass http://agent:8078/company-site/auth/; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /company-site/ { try_files $uri $uri/ /company-site/index.html; }
  location /harness/ { try_files $uri $uri/ /index.html; }
  location /harness-embed/ {
    set $harness_embed_allowed 0;
    if ($http_sec_fetch_dest = "iframe") { set $harness_embed_allowed 1; }
    if ($http_referer ~ "^https://lundu\.eiscore\.top/") { set $harness_embed_allowed 1; }
    if ($harness_embed_allowed = 0) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_pass http://deepseek-web:3081/;
    proxy_redirect / /harness-embed/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/javascript;
    sub_filter '<base href="/">' '<base href="/harness-embed/"><script>window.__EIS_HARNESS__=1;(()=>{const dismiss=()=>{const dialog=document.querySelector("[role=dialog][aria-label=内测声明]");const button=dialog?.querySelector("button");if(button){observer.disconnect();button.click()}};const observer=new MutationObserver(dismiss);observer.observe(document,{childList:true,subtree:true});dismiss();const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const EISWebSocket=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"])Object.defineProperty(EISWebSocket,k,{value:W[k],enumerable:true});EISWebSocket.prototype=W.prototype;window.WebSocket=EISWebSocket})()</script>';
    sub_filter '"/plugins/' '"/harness-embed-plugins/';
    sub_filter '"/assets/' '"/harness-embed-assets/';
  }
  location /harness-embed/assets/ {
    proxy_pass http://deepseek-web:3081/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /harness-embed-plugins/ { proxy_pass http://deepseek-web:3081/plugins/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 1h; }
  location /harness-embed-assets/ { proxy_pass http://deepseek-web:3081/assets/; proxy_set_header Host $host; }
  location /harness-embed-api/ { proxy_pass http://deepseek-web:3081/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /harness-api/ { return 403; }
  location /harness-plugins/ { return 403; }
  location /harness-assets/ { return 403; }
}
