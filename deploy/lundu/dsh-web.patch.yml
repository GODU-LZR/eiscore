- id: ui-eiscore-embed
  disabled: true

# Business conversations use the reviewed standard composition. Keep
# ui-workspace enabled for the native history/session list.
- id: plan-mode
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: agent-presets
  disabled: true

- insert:
    - id: eiscore-auth
      name: '/opt/eiscore-harness/client-plugins/eiscore-auth/lib/index.js'
      inject: [connection]
    - id: eiscore-digital-twin
      name: '/opt/eiscore-harness/client-plugins/digital-twin/lib/index.js'
      inject: [connection]
    - id: eiscore-enterprise-bi
      name: '/opt/eiscore-harness/client-plugins/enterprise-bi/lib/index.js'
      inject: [connection]
    - id: eiscore-visual-response-policy
      name: '/opt/eiscore-harness/visual-response-policy.mjs'
      inject: [systemPrompt]
    - id: eiscore-dsh-web-defaults
      name: '/opt/eiscore-harness/dsh-web-defaults.mjs'
      inject: [workspaceRegistry]
