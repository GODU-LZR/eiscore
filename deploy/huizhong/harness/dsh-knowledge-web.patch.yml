# Knowledge profile: authenticated Harness plus only the digital-twin tools.
# Business entry/session role switching is intentionally absent.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: command-compact
  disabled: true
- id: command-feedback
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: ui-eiscore-embed
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: agent-presets
  disabled: true
- insert:
    - id: eiscore-auth
      name: '/opt/eiscore-harness/client-plugins/eiscore-auth/lib/index.js'
      inject: [connection, webServer]
    - id: eiscore-tools
      name: '/opt/eiscore-harness/eiscore-tools.mjs'
      inject: [tools]
    - id: eiscore-knowledge-role
      name: '/opt/eiscore-harness/knowledge-role-policy.mjs'
      inject: [systemPrompt]
    - id: eiscore-dsh-web-defaults
      name: '/opt/eiscore-harness/dsh-web-defaults.mjs'
      inject: [workspaceRegistry]
