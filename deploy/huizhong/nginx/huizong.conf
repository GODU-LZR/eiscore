    location = /harness-brand/vendor/viz-standalone.js { alias /srv/huizong-harness/vendor/viz-standalone.js; expires 30d; }
    location = /harness-brand/vendor/echarts.min.js.LICENSE.txt { alias /srv/huizong-harness/vendor/echarts.min.js.LICENSE.txt; expires 30d; }
    location = /harness-brand/vendor/viz-standalone.js.LICENSE.txt { alias /srv/huizong-harness/vendor/viz-standalone.js.LICENSE.txt; expires 30d; }
    location /harness-brand/ { return 404; }
    location ^~ /harness-embed/ {
        proxy_pass http://deepseek-web:3081/;
        proxy_redirect / /harness-embed/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter '<base href="/">' '<base href="/harness-embed/"><script src="/harness-brand/huizhong-ui.js?v=huizong-20261020-shared-harness1"></script><script>(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const E=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"] )Object.defineProperty(E,k,{value:W[k],enumerable:true});E.prototype=W.prototype;window.WebSocket=E})()</script>';
