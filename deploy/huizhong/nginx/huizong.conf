server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    client_max_body_size 16m;
    large_client_header_buffers 4 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /company-site/huizhong; }
    location = /company-site { return 302 /company-site/huizhong; }
    location = /company-site/ { return 302 /company-site/huizhong; }
    location = /company-site/huizhong {
        try_files /company-site/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ ^/(purchase|production|quality|equipment|decision|document-intake)(/|$) { return 404; }
    location ~ /\. { deny all; }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location = /asset-manifest.json { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location ~* \.(js|mjs|css|png|jpg|jpeg|webp|svg|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /hr/index.html { try_files $uri =404; }
    location = /materials/index.html { try_files $uri =404; }
    location = /sales/index.html { try_files $uri =404; }
    location = /apps/index.html { try_files $uri =404; }
    location = /company-site/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /mobile { return 302 /mobile/; }
    location = /mobile/ { try_files /mobile/index.html =404; }
    location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
    location = /hr/ { try_files /index.html =404; }
    location = /materials/ { try_files /index.html =404; }
    location = /sales/ { try_files /index.html =404; }
    location = /apps/ { try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Prefix /api;
    }
    location /company-site/auth/ {
        proxy_pass http://agent:8078/company-site/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    location /company-site/public/ {
        proxy_pass http://agent:8078/company-site/public/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    # Knowledge workbench APIs must reach the isolated knowledge Agent. Keep
    # this prefix separate from the business /agent and /twin routes.
    location ^~ /harness-knowledge-agent/ {
        proxy_pass http://knowledge-agent:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }
    location /agent/ {
        proxy_pass http://agent:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location = /ws {
        proxy_pass http://agent:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location = /harness-brand/huizhong-ui.js { alias /srv/huizong-harness/huizhong-ui.js; expires -1; }
    location = /harness-brand/huizhong-ui.css { alias /srv/huizong-harness/huizhong-ui.css; expires -1; }
