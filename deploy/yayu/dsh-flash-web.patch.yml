- id: ui-eiscore-embed
  disabled: true

- insert:
    - id: eiscore-auth
      name: '/opt/eiscore-harness/client-plugins/eiscore-auth/lib/index.js'
      inject: [connection]
    - id: eiscore-tools
      name: '/opt/eiscore-harness/eiscore-tools.mjs'
      inject: [tools]
    - id: eiscore-flash-context
      name: '/opt/eiscore-harness/client-plugins/flash-context/lib/index.js'
      inject: [connection, webServer]
    - id: eiscore-dsh-web-defaults
      name: '/opt/eiscore-harness/dsh-web-defaults.mjs'
      inject: [workspaceRegistry]
