server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /srv/releases/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    client_max_body_size 16m;
    large_client_header_buffers 4 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { try_files /index.html =404; }
    location ~ ^/(company-site|materials|purchase|production|quality|equipment|decision|document-intake)(/|$) { return 404; }
    location ~ /\. { deny all; }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location /config/ { try_files $uri =404; add_header Cache-Control "no-store" always; }
    location = /asset-manifest.json { try_files $uri =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; expires -1; }
    location ~* \.(js|mjs|css|png|jpg|jpeg|webp|svg|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /hr/index.html { try_files $uri =404; }
    location = /sales/index.html { try_files $uri =404; }
    location = /apps/index.html { try_files $uri =404; }
    location = /mobile { return 302 /mobile/; }
    location = /mobile/ { try_files /mobile/index.html =404; }
    location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
    location = /hr/ { try_files /index.html =404; }
    location = /sales/ { try_files /index.html =404; }
    location = /apps/ { try_files /apps/index.html =404; }
    location ^~ /apps/ { try_files $uri $uri/ /apps/index.html; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/eiscore/ { return 403; }
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Prefix /api;
    }
    location ^~ /company-site/auth/ {
        proxy_pass http://agent:8078/company-site/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /company-site/public/ {
        proxy_pass http://agent:8078/company-site/public/;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
    }
    # No public company site is published in the development environment.
    location = /agent/company-site/public/site-config {
        alias /srv/releases/current/config/site-profile.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location /agent/ {
        proxy_pass http://agent:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location = /ws {
        proxy_pass http://agent:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /harness-brand/ { return 404; }
    location ^~ /harness-embed/ {
        proxy_pass http://deepseek-web:3081/;
        proxy_redirect / /harness-embed/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter '<base href="/">' '<base href="/harness-embed/"><script>(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const E=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"] )Object.defineProperty(E,k,{value:W[k],enumerable:true});E.prototype=W.prototype;window.WebSocket=E})()</script>';
        sub_filter '"/plugins/' '"/harness-embed-plugins/';
        sub_filter '"/assets/' '"/harness-embed-assets/';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /harness-embed-assets/ {
        proxy_pass http://deepseek-web:3081/assets/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location ^~ /harness-embed-plugins/ {
        proxy_pass http://deepseek-web:3081/plugins/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /plugins/events {
        proxy_pass http://deepseek-web:3081/plugins/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /harness-embed-api/ {
        proxy_pass http://deepseek-web:3081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /flash/ {
        proxy_pass http://flash-agent-runtime:8078;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /flash-agent/ {
        proxy_pass http://flash-agent-runtime:8078/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /harness-flash-embed/ {
        proxy_pass http://deepseek-flash-web:3081/;
        proxy_redirect / /harness-flash-embed/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter '<base href="/">' '<base href="/harness-flash-embed/"><script>(()=>{const f=window.fetch;window.fetch=(i,o)=>{if(typeof i==="string"&&i.startsWith("/api/"))i="/harness-flash-embed-api/"+i.slice(5);else if(i instanceof URL&&i.pathname.startsWith("/api/"))i=new URL("/harness-flash-embed-api/"+i.pathname.slice(5)+i.search,i);return f(i,o)};const W=window.WebSocket;const E=function(u,p){return new W(typeof u==="string"?u.replace("/api/","/harness-flash-embed-api/"):u,p)};for(const k of ["CONNECTING","OPEN","CLOSING","CLOSED"] )Object.defineProperty(E,k,{value:W[k],enumerable:true});E.prototype=W.prototype;window.WebSocket=E})()</script>';
        sub_filter '"/plugins/' '"/harness-flash-embed-plugins/';
        sub_filter '"/assets/' '"/harness-flash-embed-assets/';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /harness-flash-embed-assets/ {
        proxy_pass http://deepseek-flash-web:3081/assets/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location ^~ /harness-flash-embed-plugins/ {
        proxy_pass http://deepseek-flash-web:3081/plugins/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /harness-flash-embed-plugins-events {
        proxy_pass http://deepseek-flash-web:3081/plugins/events;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /harness-flash-embed-api/ {
        proxy_pass http://deepseek-flash-web:3081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
