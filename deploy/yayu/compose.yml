name: yayu-eiscore
services:
  db:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: yayu-eiscore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: eiscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?required}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?required}
      FLASH_AGENT_DB_PASSWORD: ${FLASH_AGENT_DB_PASSWORD:?required}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${YAYU_SOURCE_ROOT:-./source}/database/bootstrap/roles-v2.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ${YAYU_SOURCE_ROOT:-./source}/database/baselines/eiscore-db-v1/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ${YAYU_SOURCE_ROOT:-./source}/database/baselines/eiscore-db-v1/register.sql:/docker-entrypoint-initdb.d/02_register.sql:ro
      - ${YAYU_SOURCE_ROOT:-./source}/scripts/configure-database-runtime-secrets-v2.sh:/docker-entrypoint-initdb.d/04_runtime_secrets.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d eiscore']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
  api:
    image: postgrest/postgrest@sha256:d2009b5c9deffc210c8a5592698472fede14fd9f6ca89823c8474ca54d58c012
    container_name: yayu-eiscore-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://eiscore_authenticator:${POSTGREST_DB_PASSWORD:?required}@db:5432/eiscore
      PGRST_DB_SCHEMAS: public,hr,scm,app_center,workflow,app_data,company_site
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?required}
      PGRST_OPENAPI_SERVER_PROXY_URI: https://yayu.eiscore.top/api
    depends_on: {db: {condition: service_healthy}}
    networks: [data]
  agent:
    build: {context: '${YAYU_SOURCE_ROOT:-./source}', dockerfile: realtime/Dockerfile.prod}
    image: ${YAYU_RUNTIME_IMAGE:?YAYU_RUNTIME_IMAGE is required}
    container_name: yayu-eiscore-agent
    restart: unless-stopped
    environment:
      RUNTIME_PROFILE: business
      NODE_ENV: production
      PORT: 8078
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_agent
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?required}
      AGENT_POSTGREST_URL: http://api:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?required}
      COMPANY_SITE_PREVIEW_ALLOW_DRAFT: 'true'
      EISCORE_HARNESS_ENABLED: ${EISCORE_HARNESS_ENABLED:-false}
      EISCORE_HARNESS_URL: http://harness-bridge:3080
      EISCORE_HARNESS_AUDIT_FILE: /var/lib/eiscore/harness-audit.jsonl
      EISCORE_HARNESS_AUDIT_HASH_KEY: ${EISCORE_HARNESS_AUDIT_HASH_KEY:?required}
      EISCORE_HARNESS_BRIDGE_SECRET: ${EISCORE_HARNESS_BRIDGE_SECRET:?required}
      EISCORE_TOOL_PROXY_SECRET: ${EISCORE_TOOL_PROXY_SECRET:?required}
    volumes:
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/agent-harness:ro
      - harness_audit:/var/lib/eiscore
    depends_on: {db: {condition: service_healthy}, api: {condition: service_started}}
    networks: [data, business]
  flash-agent-runtime:
    build: {context: '${YAYU_SOURCE_ROOT:-./source}', dockerfile: realtime/Dockerfile.prod}
    image: ${YAYU_RUNTIME_IMAGE:?YAYU_RUNTIME_IMAGE is required}
    container_name: yayu-eiscore-flash-agent
    restart: unless-stopped
    environment:
      RUNTIME_PROFILE: flash
      NODE_ENV: production
      PORT: 8078
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_flash_agent
      AGENT_DB_PASSWORD: ${FLASH_AGENT_DB_PASSWORD:?required}
      AGENT_POSTGREST_ROLE: eiscore_flash_agent
      AGENT_POSTGREST_URL: http://api:3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?required}
      EISCORE_HARNESS_ENABLED: ${EISCORE_HARNESS_ENABLED:-false}
      EISCORE_HARNESS_URL: http://flash-harness-bridge:3080
      EISCORE_HARNESS_AUDIT_FILE: /var/lib/eiscore/flash-harness-audit.jsonl
      EISCORE_HARNESS_AUDIT_HASH_KEY: ${FLASH_EISCORE_HARNESS_AUDIT_HASH_KEY:?required}
      EISCORE_HARNESS_BRIDGE_SECRET: ${FLASH_EISCORE_HARNESS_BRIDGE_SECRET:?required}
      EISCORE_TOOL_PROXY_SECRET: ${FLASH_EISCORE_TOOL_PROXY_SECRET:?required}
      FLASH_PROJECT_PATH: ${FLASH_PROJECT_PATH:-eiscore-apps/src/views/drafts}
      FLASH_WORKDIR: ${FLASH_WORKDIR:-/workspace/eiscore-apps/src/views/drafts}
    volumes:
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/agent-harness:ro
      - flash_harness_audit:/var/lib/eiscore
      - flash_drafts:/workspace/eiscore-apps/src/views/drafts
    depends_on: {db: {condition: service_healthy}, api: {condition: service_started}}
    networks: [data, flash]
  harness-bridge:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    container_name: yayu-eiscore-harness-bridge
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: [node]
    command: [/opt/eiscore-harness/dsh-http-bridge.mjs]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_PROVIDER: deepseek-official
      DSH_MODEL: deepseek-flash
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HARNESS_PROFILE: business
      HARNESS_PLUGINS: worker-grid,company-sales,independent-site-sales
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://agent:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: ${EISCORE_HARNESS_BRIDGE_SECRET:?required}
      EISCORE_TOOL_PROXY_SECRET: ${EISCORE_TOOL_PROXY_SECRET:?required}
      BRIDGE_STATE_FILE: /var/lib/dsh/bridge-state.json
    volumes:
      - harness_bridge_home:/var/lib/dsh
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/opt/eiscore-harness:ro
    depends_on: [agent]
    networks: [business]
  deepseek-web:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    container_name: yayu-eiscore-deepseek-web
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: [node]
    command: [--expose-internals, /opt/eiscore-harness/dsh-web-runner.mjs]
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/business
      DSH_DEFAULT_WORKSPACE_TITLE: 业务助手工作区
      DSH_TRUSTED_HOST: yayu.eiscore.top
      DSH_PATCH_PATH: /opt/eiscore-harness/dsh-web.patch.yml
      DSH_PROVIDER: deepseek-official
      DSH_MODEL: deepseek-flash
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EISCORE_HARNESS_CAPABILITY_PROFILE: business
      EISCORE_HARNESS_PUBLIC_PREFIX: /harness-embed
      EISCORE_GATEWAY_URL: http://agent:8078
      EISCORE_AUTH_URL: https://yayu.eiscore.top
      EISCORE_AUTH_ORIGINS: https://yayu.eiscore.top
      EISCORE_TOOL_PROXY_URL: http://agent:8078/internal/harness/tool
      EISCORE_TOOL_PROXY_SECRET: ${EISCORE_TOOL_PROXY_SECRET:?required}
    volumes:
      - deepseek_web_home:/var/lib/dsh
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/opt/eiscore-harness:ro
    depends_on: [agent]
    networks: [business]
  deepseek-flash-web:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    container_name: yayu-eiscore-deepseek-flash-web
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: [node]
    command: [--expose-internals, /opt/eiscore-harness/dsh-web-runner.mjs]
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/flash
      DSH_DEFAULT_WORKSPACE_TITLE: 闪念工作区
      DSH_TRUSTED_HOST: yayu.eiscore.top
      DSH_PATCH_PATH: /opt/eiscore-harness/dsh-flash-web.patch.yml
      DSH_PROVIDER: deepseek-official
      DSH_MODEL: deepseek-flash
      EISCORE_AUTH_COOKIE_PREFIX: flash-
      EISCORE_HARNESS_AUTH_RETURN_PATH: /harness-flash-embed-api/eiscore/auth/handoff
      DEEPSEEK_API_KEY: ${FLASH_DEEPSEEK_API_KEY:-}
      EISCORE_HARNESS_CAPABILITY_PROFILE: flash
      EISCORE_HARNESS_PUBLIC_PREFIX: /harness-flash-embed
      EISCORE_GATEWAY_URL: http://flash-agent-runtime:8078
      EISCORE_AUTH_GATEWAY_URL: https://yayu.eiscore.top
      EISCORE_AUTH_URL: https://yayu.eiscore.top
      EISCORE_AUTH_ORIGINS: https://yayu.eiscore.top
      EISCORE_TOOL_PROXY_URL: http://flash-agent-runtime:8078/internal/harness/tool
      EISCORE_TOOL_PROXY_SECRET: ${FLASH_EISCORE_TOOL_PROXY_SECRET:?required}
    volumes:
      - flash_deepseek_web_home:/var/lib/dsh
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/opt/eiscore-harness:ro
    depends_on: [flash-agent-runtime]
    networks: [flash]
  flash-harness-bridge:
    image: eiscore/deepseek-harness:0.1.2-rc.1-bridge1
    container_name: yayu-eiscore-flash-harness-bridge
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    entrypoint: [node]
    command: [/opt/eiscore-harness/dsh-http-bridge.mjs]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_PROVIDER: deepseek-official
      DSH_MODEL: deepseek-flash
      DEEPSEEK_API_KEY: ${FLASH_DEEPSEEK_API_KEY:-}
      HARNESS_PROFILE: flash
      HARNESS_PLUGINS: flash-builder
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://flash-agent-runtime:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: ${FLASH_EISCORE_HARNESS_BRIDGE_SECRET:?required}
      EISCORE_TOOL_PROXY_SECRET: ${FLASH_EISCORE_TOOL_PROXY_SECRET:?required}
      BRIDGE_STATE_FILE: /var/lib/dsh/flash-bridge-state.json
    volumes:
      - flash_harness_bridge_home:/var/lib/dsh
      - ${YAYU_HARNESS_ROOT:?YAYU_HARNESS_ROOT is required}:/opt/eiscore-harness:ro
    depends_on: [flash-agent-runtime]
    networks: [flash]
  web:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: yayu-eiscore-web
    restart: unless-stopped
    ports: ['127.0.0.1:18396:80']
    volumes:
      - ./releases:/srv/releases:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, agent, deepseek-web, flash-agent-runtime, deepseek-flash-web, flash-harness-bridge]
    networks: [data, business, flash, edge]
  builder:
    image: node:20.19.0-bookworm-slim@sha256:5cfa999422613d3b34f766cbb814d964cbfcb76aaf3607e805da21cccb352bac
    profiles: [tools]
    working_dir: /workspace
    environment:
      EISCORE_SOURCE_REVISION: ${EISCORE_SOURCE_REVISION:?EISCORE_SOURCE_REVISION is required}
    volumes:
      - ${YAYU_SOURCE_ROOT:-./source}:/workspace
      - ./releases:/releases
      - ./config/eiscore-enterprise.json:/workspace/eiscore-base/public/config/eiscore-enterprise.json:ro
    entrypoint: [bash, /workspace/deploy/yayu/build-frontends.sh]
volumes:
  pgdata:
  harness_audit:
  harness_bridge_home:
  deepseek_web_home:
  flash_harness_audit:
  flash_harness_bridge_home:
  flash_deepseek_web_home:
  flash_drafts:
networks:
  data:
    name: yayu-eiscore-data
  business:
    name: yayu-eiscore-business
  flash:
    name: yayu-eiscore-flash
  edge:
    name: yayu-eiscore-edge
