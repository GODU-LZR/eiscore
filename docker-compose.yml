
services:
  db:
    image: postgres@sha256:f992505e18f114c1e5102ac4dcf00f791b44462f6a423d899320f0bbf80e386f
    container_name: eiscore-db
    restart: always
    env_file:
      - ./env/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: eiscore
      POSTGREST_DB_PASSWORD: "${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}"
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      FLASH_AGENT_DB_PASSWORD: "${FLASH_AGENT_DB_PASSWORD:?FLASH_AGENT_DB_PASSWORD is required}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/bootstrap/roles-v2.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./database/baselines/eiscore-db-v1/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/baselines/eiscore-db-v1/register.sql:/docker-entrypoint-initdb.d/02_register.sql:ro
      - ./scripts/configure-database-runtime-secrets-v2.sh:/docker-entrypoint-initdb.d/04_runtime_secrets.sh:ro
    networks: [data-plane]

  api:
    image: postgrest/postgrest@sha256:00c1ec8a9339f52a7e765cb3bd3ab5b001f0b5dd954cfb69b43b9de494a9a0aa
    container_name: eiscore-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./env/.env
    environment:
      PGRST_DB_URI: "postgres://eiscore_authenticator:${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}@db:5432/eiscore"
      PGRST_DB_SCHEMAS: "public,hr,scm,app_center,workflow,app_data"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
    depends_on:
       - db
    networks: [data-plane]

  nginx:
    image: nginx@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
    container_name: eiscore-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./eiscore-base/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - deepseek-web
      - deepseek-flash-web
      - deepseek-assistant-web
    networks: [data-plane, business-internal, business-assistant-internal, flash-internal]

  deepseek-web:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-deepseek-web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-web-runner.mjs"]
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/business
      DSH_DEFAULT_WORKSPACE_TITLE: 业务助手工作区
      EISCORE_HARNESS_PERSONA: workbench
      EISCORE_AUTH_COOKIE_PREFIX: workbench-
      EISCORE_DSH_AUTH_COOKIE_PREFIX: workbench-
      EISCORE_HARNESS_AUTH_RETURN_PATH: /harness-workbench-embed-api/eiscore/auth/handoff
      EISCORE_HARNESS_CAPABILITY_PROFILE: business
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      EISCORE_GATEWAY_URL: http://agent-runtime:8078
      EISCORE_TOOL_PROXY_URL: http://agent-runtime:8078/internal/harness/tool
      EISCORE_TOOL_PROXY_SECRET: "${EISCORE_TOOL_PROXY_SECRET:?EISCORE_TOOL_PROXY_SECRET is required}"
    volumes:
      - deepseek_web_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
      - ./agent-harness/dsh-web.patch.yml:/opt/eiscore-harness/dsh-web.patch.yml:ro
      - ./agent-harness/dsh-web-runner.mjs:/opt/eiscore-harness/dsh-web-runner.mjs:ro
      - ./agent-harness/dsh-web-defaults.mjs:/opt/eiscore-harness/dsh-web-defaults.mjs:ro
    depends_on:
      - agent-runtime
    networks:
      business-internal:
        aliases: [deepseek-workbench-web]

  deepseek-flash-web:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-deepseek-flash-web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-web-runner.mjs"]
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/flash
      DSH_DEFAULT_WORKSPACE_TITLE: 闪念工作区
      DSH_PATCH_PATH: /opt/eiscore-harness/dsh-flash-web.patch.yml
      EISCORE_AUTH_COOKIE_PREFIX: flash-
      EISCORE_DSH_AUTH_COOKIE_PREFIX: flash-
      EISCORE_HARNESS_PERSONA: flash
      EISCORE_HARNESS_AUTH_RETURN_PATH: /harness-flash-embed-api/eiscore/auth/handoff
      EISCORE_HARNESS_CAPABILITY_PROFILE: flash
      DEEPSEEK_API_KEY: "${FLASH_DEEPSEEK_API_KEY:?FLASH_DEEPSEEK_API_KEY is required}"
      EISCORE_GATEWAY_URL: http://flash-agent-runtime:8078
      EISCORE_TOOL_PROXY_URL: http://flash-agent-runtime:8078/internal/harness/tool
      EISCORE_TOOL_PROXY_SECRET: "${FLASH_EISCORE_TOOL_PROXY_SECRET:?FLASH_EISCORE_TOOL_PROXY_SECRET is required}"
    volumes:
      - deepseek_flash_web_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
      - ./agent-harness/dsh-web-runner.mjs:/opt/eiscore-harness/dsh-web-runner.mjs:ro
      - ./agent-harness/dsh-flash-web.patch.yml:/opt/eiscore-harness/dsh-flash-web.patch.yml:ro
      - ./agent-harness/dsh-web-defaults.mjs:/opt/eiscore-harness/dsh-web-defaults.mjs:ro
    depends_on:
      - flash-agent-runtime
    networks: [flash-internal]

  # Coding assistant and business workbench use separate Web profiles. The
  # existing deepseek-web service remains the workbench/history owner.
  deepseek-assistant-web:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-deepseek-assistant-web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-web-runner.mjs"]
    environment:
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/assistant
      DSH_DEFAULT_WORKSPACE_TITLE: 工作助手工作区
      EISCORE_HARNESS_PERSONA: work-assistant
      EISCORE_HARNESS_CAPABILITY_PROFILE: business
      EISCORE_AUTH_COOKIE_PREFIX: assistant-
      EISCORE_DSH_AUTH_COOKIE_PREFIX: assistant-
      EISCORE_HARNESS_AUTH_RETURN_PATH: /harness-assistant-embed-api/eiscore/auth/handoff
      DSH_PATCH_PATH: /opt/eiscore-harness/dsh-assistant-web.patch.yml
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      EISCORE_GATEWAY_URL: http://assistant-agent-runtime:8078
      EISCORE_AUTH_URL: "${EISCORE_AUTH_URL:-http://localhost}"
      EISCORE_TOOL_PROXY_URL: http://assistant-agent-runtime:8078/internal/harness/tool
      EISCORE_TOOL_PROXY_SECRET: "${ASSISTANT_EISCORE_TOOL_PROXY_SECRET:?ASSISTANT_EISCORE_TOOL_PROXY_SECRET is required}"
    volumes:
      - deepseek_assistant_web_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
      - ./agent-harness/dsh-assistant-web.patch.yml:/opt/eiscore-harness/dsh-assistant-web.patch.yml:ro
      - ./agent-harness/dsh-web-runner.mjs:/opt/eiscore-harness/dsh-web-runner.mjs:ro
      - ./agent-harness/dsh-web-defaults.mjs:/opt/eiscore-harness/dsh-web-defaults.mjs:ro
    depends_on:
      - assistant-agent-runtime
    networks: [business-assistant-internal]

  agent-runtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: eiscore-agent-runtime
    restart: always
    command: sh -lc "node index.js"
    ports:
      - "8078:8078"
    env_file:
      - ./env/.env
    environment:
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_agent
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      # Local click-test environments seed the company site as draft first.
      # Allow the public profile reader to use that draft without changing production behavior.
      NODE_ENV: development
      COMPANY_SITE_PREVIEW_ALLOW_DRAFT: "true"
      CHANNEL: eis_events
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      EISCORE_HARNESS_ENABLED: "${EISCORE_HARNESS_ENABLED:-true}"
      RUNTIME_PROFILE: business
      HARNESS_PERSONA: workbench
      EISCORE_HARNESS_URL: "${EISCORE_HARNESS_URL:-http://harness-bridge:3080}"
      EISCORE_HARNESS_AUDIT_FILE: "${EISCORE_HARNESS_AUDIT_FILE:-/var/lib/eiscore/harness-audit.jsonl}"
      EISCORE_HARNESS_AUDIT_HASH_KEY: "${EISCORE_HARNESS_AUDIT_HASH_KEY:?EISCORE_HARNESS_AUDIT_HASH_KEY is required}"
      EISCORE_HARNESS_BRIDGE_SECRET: "${EISCORE_HARNESS_BRIDGE_SECRET:?EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${EISCORE_TOOL_PROXY_SECRET:?EISCORE_TOOL_PROXY_SECRET is required}"
      FLASH_PROJECT_PATH: "${FLASH_PROJECT_PATH:-eiscore-apps/src/views/drafts}"
      FLASH_WORKDIR: "${FLASH_WORKDIR:-/workspace/eiscore-apps/src/views/drafts}"
    volumes:
      # Mount runtime source so index.js and workflow-engine.js stay in sync
      - ./realtime:/app
      - ./agent-harness:/agent-harness:ro
      # Mount source code directories for file operations
      - ./eiscore-base:/workspace/eiscore-base
      - ./eiscore-hr:/workspace/eiscore-hr
      - ./eiscore-materials:/workspace/eiscore-materials
      - ./eiscore-apps:/workspace/eiscore-apps
      - ./eiscore-equipment:/workspace/eiscore-equipment
      - document_intake_data:/app/data/document-intake
      - harness_audit:/var/lib/eiscore
    depends_on:
      - db
    networks: [data-plane, business-internal]

  assistant-agent-runtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: eiscore-assistant-agent-runtime
    restart: always
    command: sh -lc "node index.js"
    env_file:
      - ./env/.env
    environment:
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_agent
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      NODE_ENV: development
      COMPANY_SITE_PREVIEW_ALLOW_DRAFT: "true"
      CHANNEL: eis_events
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      EISCORE_HARNESS_ENABLED: "${EISCORE_HARNESS_ENABLED:-true}"
      RUNTIME_PROFILE: business
      HARNESS_PERSONA: work-assistant
      EISCORE_HARNESS_URL: http://assistant-harness-bridge:3080
      EISCORE_HARNESS_AUDIT_FILE: "${ASSISTANT_EISCORE_HARNESS_AUDIT_FILE:-/var/lib/eiscore/assistant-harness-audit.jsonl}"
      EISCORE_HARNESS_AUDIT_HASH_KEY: "${ASSISTANT_EISCORE_HARNESS_AUDIT_HASH_KEY:?ASSISTANT_EISCORE_HARNESS_AUDIT_HASH_KEY is required}"
      EISCORE_HARNESS_BRIDGE_SECRET: "${ASSISTANT_EISCORE_HARNESS_BRIDGE_SECRET:?ASSISTANT_EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${ASSISTANT_EISCORE_TOOL_PROXY_SECRET:?ASSISTANT_EISCORE_TOOL_PROXY_SECRET is required}"
      FLASH_PROJECT_PATH: "${FLASH_PROJECT_PATH:-eiscore-apps/src/views/drafts}"
      FLASH_WORKDIR: "${FLASH_WORKDIR:-/workspace/eiscore-apps/src/views/drafts}"
    volumes:
      - ./realtime:/app
      - ./agent-harness:/agent-harness:ro
      - ./eiscore-base:/workspace/eiscore-base
      - ./eiscore-hr:/workspace/eiscore-hr
      - ./eiscore-materials:/workspace/eiscore-materials
      - ./eiscore-apps:/workspace/eiscore-apps
      - ./eiscore-equipment:/workspace/eiscore-equipment
      - assistant_document_intake_data:/app/data/document-intake
      - assistant_harness_audit:/var/lib/eiscore
    depends_on:
      - db
    networks: [data-plane, business-assistant-internal]

  flash-agent-runtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: eiscore-flash-agent-runtime
    restart: always
    command: sh -lc "node index.js"
    env_file:
      - ./env/.env
    environment:
      RUNTIME_PROFILE: flash
      HARNESS_PERSONA: flash
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: "${FLASH_AGENT_DB_USER:?FLASH_AGENT_DB_USER is required}"
      AGENT_DB_PASSWORD: "${FLASH_AGENT_DB_PASSWORD:?FLASH_AGENT_DB_PASSWORD is required}"
      AGENT_POSTGREST_ROLE: eiscore_flash_agent
      NODE_ENV: development
      COMPANY_SITE_PREVIEW_ALLOW_DRAFT: "false"
      CHANNEL: eis_events
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      EISCORE_HARNESS_ENABLED: "${EISCORE_HARNESS_ENABLED:-true}"
      EISCORE_HARNESS_URL: "${FLASH_EISCORE_HARNESS_URL:-http://flash-harness-bridge:3080}"
      EISCORE_HARNESS_AUDIT_FILE: "${FLASH_EISCORE_HARNESS_AUDIT_FILE:-/var/lib/eiscore/flash-harness-audit.jsonl}"
      EISCORE_HARNESS_AUDIT_HASH_KEY: "${FLASH_EISCORE_HARNESS_AUDIT_HASH_KEY:?FLASH_EISCORE_HARNESS_AUDIT_HASH_KEY is required}"
      EISCORE_HARNESS_BRIDGE_SECRET: "${FLASH_EISCORE_HARNESS_BRIDGE_SECRET:?FLASH_EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${FLASH_EISCORE_TOOL_PROXY_SECRET:?FLASH_EISCORE_TOOL_PROXY_SECRET is required}"
      FLASH_PROJECT_PATH: "${FLASH_PROJECT_PATH:-eiscore-apps/src/views/drafts}"
      FLASH_WORKDIR: "${FLASH_WORKDIR:-/workspace/eiscore-apps/src/views/drafts}"
    volumes:
      - ./realtime:/app
      - ./agent-harness:/agent-harness:ro
      - ./eiscore-apps:/workspace/eiscore-apps
      - flash_harness_audit:/var/lib/eiscore
    depends_on:
      - db
    networks: [data-plane, flash-internal]

  harness-bridge:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-harness-bridge
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-http-bridge.mjs"]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/business
      DSH_DEFAULT_WORKSPACE_TITLE: 业务助手工作区
      DSH_PROVIDER: "${DSH_PROVIDER:?DSH_PROVIDER is required}"
      DSH_MODEL: "${DSH_MODEL:?DSH_MODEL is required}"
      HARNESS_PROFILE: business
      HARNESS_PERSONA: workbench
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://agent-runtime:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: "${EISCORE_HARNESS_BRIDGE_SECRET:?EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${EISCORE_TOOL_PROXY_SECRET:?EISCORE_TOOL_PROXY_SECRET is required}"
      HARNESS_PLUGINS: enterprise-bi,worker-grid,digital-twin,workflow,company-sales,document-intake,engineering,independent-site-sales
      BRIDGE_MAX_CONCURRENT_REQUESTS: "${BRIDGE_MAX_CONCURRENT_REQUESTS:-16}"
      BRIDGE_MAX_SESSIONS: "${BRIDGE_MAX_SESSIONS:-1000}"
      BRIDGE_MAX_TRACKED_REQUESTS: "${BRIDGE_MAX_TRACKED_REQUESTS:-10000}"
      BRIDGE_MAX_BODY_BYTES: "${BRIDGE_MAX_BODY_BYTES:-2097152}"
      BRIDGE_MAX_RESPONSE_BYTES: "${BRIDGE_MAX_RESPONSE_BYTES:-2097152}"
      BRIDGE_SESSION_TTL_MS: "${BRIDGE_SESSION_TTL_MS:-86400000}"
      BRIDGE_PROMPT_TIMEOUT_MS: "${BRIDGE_PROMPT_TIMEOUT_MS:-120000}"
      BRIDGE_SESSION_DRAIN_TIMEOUT_MS: "${BRIDGE_SESSION_DRAIN_TIMEOUT_MS:-120000}"
      BRIDGE_RPC_TIMEOUT_MS: "${BRIDGE_RPC_TIMEOUT_MS:-120000}"
      BRIDGE_SHUTDOWN_TIMEOUT_MS: "${BRIDGE_SHUTDOWN_TIMEOUT_MS:-1000}"
      BRIDGE_STATE_FILE: "${BRIDGE_STATE_FILE:-/var/lib/dsh/bridge-state.json}"
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3080/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - harness_bridge_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
    depends_on:
      - agent-runtime
    networks: [business-internal]

  assistant-harness-bridge:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-assistant-harness-bridge
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-http-bridge.mjs"]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/assistant
      DSH_DEFAULT_WORKSPACE_TITLE: 工作助手工作区
      DSH_PROVIDER: "${DSH_PROVIDER:?DSH_PROVIDER is required}"
      DSH_MODEL: "${DSH_MODEL:?DSH_MODEL is required}"
      HARNESS_PROFILE: business
      HARNESS_PERSONA: work-assistant
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://assistant-agent-runtime:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: "${ASSISTANT_EISCORE_HARNESS_BRIDGE_SECRET:?ASSISTANT_EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${ASSISTANT_EISCORE_TOOL_PROXY_SECRET:?ASSISTANT_EISCORE_TOOL_PROXY_SECRET is required}"
      HARNESS_PLUGINS: worker-grid,enterprise-bi,document-intake,workflow,company-sales
      BRIDGE_MAX_CONCURRENT_REQUESTS: "${BRIDGE_MAX_CONCURRENT_REQUESTS:-16}"
      BRIDGE_MAX_SESSIONS: "${BRIDGE_MAX_SESSIONS:-1000}"
      BRIDGE_MAX_TRACKED_REQUESTS: "${BRIDGE_MAX_TRACKED_REQUESTS:-10000}"
      BRIDGE_MAX_BODY_BYTES: "${BRIDGE_MAX_BODY_BYTES:-2097152}"
      BRIDGE_MAX_RESPONSE_BYTES: "${BRIDGE_MAX_RESPONSE_BYTES:-2097152}"
      BRIDGE_SESSION_TTL_MS: "${BRIDGE_SESSION_TTL_MS:-86400000}"
      BRIDGE_PROMPT_TIMEOUT_MS: "${BRIDGE_PROMPT_TIMEOUT_MS:-120000}"
      BRIDGE_SESSION_DRAIN_TIMEOUT_MS: "${BRIDGE_SESSION_DRAIN_TIMEOUT_MS:-120000}"
      BRIDGE_RPC_TIMEOUT_MS: "${BRIDGE_RPC_TIMEOUT_MS:-120000}"
      BRIDGE_SHUTDOWN_TIMEOUT_MS: "${BRIDGE_SHUTDOWN_TIMEOUT_MS:-1000}"
      BRIDGE_STATE_FILE: "${ASSISTANT_BRIDGE_STATE_FILE:-/var/lib/dsh/assistant-bridge-state.json}"
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3080/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - assistant_harness_bridge_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
    depends_on:
      - assistant-agent-runtime
    networks: [business-assistant-internal]

  flash-harness-bridge:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    container_name: eiscore-flash-harness-bridge
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-http-bridge.mjs"]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_DEFAULT_WORKSPACE: /var/lib/dsh/workspaces/flash
      DSH_DEFAULT_WORKSPACE_TITLE: 闪念工作区
      DSH_PROVIDER: "${DSH_PROVIDER:?DSH_PROVIDER is required}"
      DSH_MODEL: "${DSH_MODEL:?DSH_MODEL is required}"
      HARNESS_PROFILE: flash
      HARNESS_PERSONA: flash
      HARNESS_PLUGINS: flash-builder
      DEEPSEEK_API_KEY: "${FLASH_DEEPSEEK_API_KEY:?FLASH_DEEPSEEK_API_KEY is required}"
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://flash-agent-runtime:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: "${FLASH_EISCORE_HARNESS_BRIDGE_SECRET:?FLASH_EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${FLASH_EISCORE_TOOL_PROXY_SECRET:?FLASH_EISCORE_TOOL_PROXY_SECRET is required}"
      BRIDGE_STATE_FILE: /var/lib/dsh/flash-bridge-state.json
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3080/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - flash_harness_bridge_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
    depends_on:
      - flash-agent-runtime
    networks: [flash-internal]

volumes:
  pgdata:
  document_intake_data:
  harness_audit:
  harness_bridge_dsh_home:
  flash_harness_audit:
  flash_harness_bridge_dsh_home:
  deepseek_web_dsh_home:
  deepseek_flash_web_dsh_home:
  deepseek_assistant_web_dsh_home:
  assistant_document_intake_data:
  assistant_harness_audit:
  assistant_harness_bridge_dsh_home:

networks:
  data-plane:
    name: eiscore-data-plane
  business-internal:
    name: eiscore-business-internal
  flash-internal:
    name: eiscore-flash-internal
  business-assistant-internal:
    name: eiscore-business-assistant-internal
