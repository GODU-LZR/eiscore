<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">EIS icon</title>
  <desc id="desc">A rounded EISCore application icon with a bold EIS monogram.</desc>
  <defs>
    <linearGradient id="background" x1="28" y1="22" x2="228" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F3A" />
      <stop offset="0.56" stop-color="#174EA6" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="highlight" x1="42" y1="34" x2="190" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#061528" flood-opacity="0.36" />
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="50" fill="url(#background)" />
  <rect x="31" y="31" width="194" height="194" rx="40" fill="url(#highlight)" />
  <path d="M47 190C76 216 160 223 209 176" fill="none" stroke="#9EF2C8" stroke-width="10" stroke-linecap="round" opacity="0.74" />

  <g filter="url(#letter-shadow)">
    <text x="128"
          y="148"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="82"
          font-weight="800"
          letter-spacing="-2"
          fill="#FFFFFF">EIS</text>
  </g>

  <rect x="58" y="180" width="140" height="8" rx="4" fill="#CFFCE2" opacity="0.9" />
  <circle cx="211" cy="184" r="6" fill="#CFFCE2" opacity="0.94" />
</svg>
