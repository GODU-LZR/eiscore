services:
  db:
    image: postgres@sha256:f992505e18f114c1e5102ac4dcf00f791b44462f6a423d899320f0bbf80e386f
    container_name: eiscore-db
    restart: unless-stopped
    env_file:
      - path: ./env/.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: eiscore
      POSTGREST_DB_PASSWORD: "${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}"
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/bootstrap/roles-v2.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./database/baselines/eiscore-db-v1/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/baselines/eiscore-db-v1/register.sql:/docker-entrypoint-initdb.d/02_register.sql:ro
      - ./scripts/configure-database-runtime-secrets-v2.sh:/docker-entrypoint-initdb.d/04_runtime_secrets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eiscore"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: postgrest/postgrest@sha256:00c1ec8a9339f52a7e765cb3bd3ab5b001f0b5dd954cfb69b43b9de494a9a0aa
    container_name: eiscore-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./env/.env
        required: false
    environment:
      PGRST_DB_URI: "postgres://eiscore_authenticator:${POSTGREST_DB_PASSWORD:?POSTGREST_DB_PASSWORD is required}@db:5432/eiscore"
      PGRST_DB_SCHEMAS: "public,hr,scm,app_center,workflow,app_data"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      PGRST_OPENAPI_SERVER_PROXY_URI: "${EISCORE_PUBLIC_BASE_URL:?EISCORE_PUBLIC_BASE_URL is required}/api"
    depends_on:
      db:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui@sha256:080804ac62c9d5d358662cc6f0db96ba0be76af7af393014a1a1305d967298cc
    container_name: eiscore-swagger
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:8080"
    environment:
      BASE_URL: /doc
      API_URL: /api/
    depends_on:
      - api

  agent-runtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile.prod
    container_name: eiscore-agent-runtime
    restart: unless-stopped
    command: ["node", "index.js"]
    ports:
      - "127.0.0.1:8078:8078"
    env_file:
      - path: ./env/.env
        required: false
    environment:
      EISCORE_DB_HOST: db
      EISCORE_DB_PORT: 5432
      EISCORE_DB_NAME: eiscore
      EISCORE_AGENT_DB_USER: eiscore_agent
      AGENT_DB_PASSWORD: "${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD is required}"
      CHANNEL: eis_events
      AGENT_POSTGREST_URL: "http://api:3000"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}"
      EISCORE_HARNESS_ENABLED: "${EISCORE_HARNESS_ENABLED:?EISCORE_HARNESS_ENABLED is required}"
      EISCORE_HARNESS_URL: "${EISCORE_HARNESS_URL:?EISCORE_HARNESS_URL is required}"
      EISCORE_HARNESS_AUDIT_FILE: "${EISCORE_HARNESS_AUDIT_FILE:?EISCORE_HARNESS_AUDIT_FILE is required}"
      EISCORE_HARNESS_AUDIT_HASH_KEY: "${EISCORE_HARNESS_AUDIT_HASH_KEY:?EISCORE_HARNESS_AUDIT_HASH_KEY is required}"
      EISCORE_HARNESS_BRIDGE_SECRET: "${EISCORE_HARNESS_BRIDGE_SECRET:?EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${EISCORE_TOOL_PROXY_SECRET:?EISCORE_TOOL_PROXY_SECRET is required}"
      FLASH_PROJECT_PATH: "${FLASH_PROJECT_PATH:-eiscore-apps/src/views/drafts}"
      FLASH_WORKDIR: "${FLASH_WORKDIR:-/workspace/eiscore-apps/src/views/drafts}"
    volumes:
      - ./eiscore-base:/workspace/eiscore-base
      - ./eiscore-hr:/workspace/eiscore-hr
      - ./eiscore-materials:/workspace/eiscore-materials
      - ./eiscore-apps:/workspace/eiscore-apps
      - ./eiscore-equipment:/workspace/eiscore-equipment
      - ./data/document-intake:/app/data/document-intake
      - harness_audit:/var/lib/eiscore
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  harness-bridge:
    build:
      context: .
      dockerfile: agent-harness/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    command: ["/opt/eiscore-harness/dsh-http-bridge.mjs"]
    environment:
      PORT: 3080
      DSH_BIN: /opt/bridge/node_modules/.bin/dsh
      DSH_HOME: /var/lib/dsh
      DSH_PROVIDER: "${DSH_PROVIDER:?DSH_PROVIDER is required}"
      DSH_MODEL: "${DSH_MODEL:?DSH_MODEL is required}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      DSH_CWD: /opt/eiscore-harness
      DSH_PATCH: /opt/eiscore-harness/eiscore-restricted.cordis.yml
      EISCORE_TOOL_PROXY_URL: http://agent-runtime:8078/internal/harness/tool
      EISCORE_HARNESS_BRIDGE_SECRET: "${EISCORE_HARNESS_BRIDGE_SECRET:?EISCORE_HARNESS_BRIDGE_SECRET is required}"
      EISCORE_TOOL_PROXY_SECRET: "${EISCORE_TOOL_PROXY_SECRET:?EISCORE_TOOL_PROXY_SECRET is required}"
      HARNESS_PLUGINS: enterprise-bi,worker-grid,digital-twin,workflow,company-sales,document-intake,flash-builder,engineering,independent-site-sales
      BRIDGE_MAX_CONCURRENT_REQUESTS: "${BRIDGE_MAX_CONCURRENT_REQUESTS:-16}"
      BRIDGE_MAX_SESSIONS: "${BRIDGE_MAX_SESSIONS:-1000}"
      BRIDGE_MAX_TRACKED_REQUESTS: "${BRIDGE_MAX_TRACKED_REQUESTS:-10000}"
      BRIDGE_MAX_BODY_BYTES: "${BRIDGE_MAX_BODY_BYTES:-2097152}"
      BRIDGE_MAX_RESPONSE_BYTES: "${BRIDGE_MAX_RESPONSE_BYTES:-2097152}"
      BRIDGE_SESSION_TTL_MS: "${BRIDGE_SESSION_TTL_MS:-86400000}"
      BRIDGE_PROMPT_TIMEOUT_MS: "${BRIDGE_PROMPT_TIMEOUT_MS:-120000}"
      BRIDGE_SESSION_DRAIN_TIMEOUT_MS: "${BRIDGE_SESSION_DRAIN_TIMEOUT_MS:-120000}"
      BRIDGE_RPC_TIMEOUT_MS: "${BRIDGE_RPC_TIMEOUT_MS:-120000}"
      BRIDGE_SHUTDOWN_TIMEOUT_MS: "${BRIDGE_SHUTDOWN_TIMEOUT_MS:-1000}"
      BRIDGE_STATE_FILE: "${BRIDGE_STATE_FILE:-/var/lib/dsh/bridge-state.json}"
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3080/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - harness_bridge_dsh_home:/var/lib/dsh
      - ./agent-harness:/opt/eiscore-harness:ro
    depends_on:
      agent-runtime:
        condition: service_started

  code-server:
    image: codercom/code-server@sha256:31ad23cda720476e7eb3371a9b02fd7a5738843f6ef43beef97e9edf1960fc47
    container_name: eiscore-ide
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --bind-addr
      - 0.0.0.0:8443
      - --auth
      - none
      - --user-data-dir
      - /config/data
      - --extensions-dir
      - /config/extensions
      - --disable-telemetry
      - /config/workspace/drafts
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /home/coder
      XDG_CONFIG_HOME: /config/.config
      NODE_OPTIONS: "--no-experimental-global-navigator"
      VSCODE_NODE_OPTIONS: "--max-old-space-size=4096 --no-experimental-global-navigator"
    ports:
      - "127.0.0.1:8443:8443"
    read_only: true
    volumes:
      - code_server_tmp:/tmp
      - code_server_run:/run
      - code_server_home:/home/coder
      - ./config/code-server:/config
      - ./eiscore-apps/src/views/drafts:/config/workspace/drafts

volumes:
  pgdata:
  code_server_tmp:
  code_server_run:
  code_server_home:
  harness_audit:
  harness_bridge_dsh_home:
